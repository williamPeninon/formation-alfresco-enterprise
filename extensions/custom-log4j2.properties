# Niveaux de log personnalisés (Module 9) — fichier monté par docker-compose.extensions.yml
# dans /usr/local/tomcat/shared/classes/alfresco/extension/custom-log4j2.properties
#
# Syntaxe (log4j2) : une paire .name / .level par logger. L'identifiant entre
# "logger." et ".name" est libre mais doit être unique.
# Niveaux : ERROR < WARN < INFO < DEBUG < TRACE  (DEBUG est très verbeux !)
# Après modification : docker compose up -d --force-recreate alfresco   (COMPOSE_FILE du fichier .env inclut la surcouche)

# Authentification : utile pour diagnostiquer LDAP (décommenter pendant le TP Module 8/9)
#logger.formation-auth.name=org.alfresco.repo.security.authentication
#logger.formation-auth.level=debug

# Synchronisation LDAP
#logger.formation-ldap.name=org.alfresco.repo.security.sync.ldap
#logger.formation-ldap.level=debug

# Envoi d'e-mails (SMTP sortant)
