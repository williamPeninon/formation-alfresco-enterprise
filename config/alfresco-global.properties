# =============================================================================
# alfresco-global.properties — fichier central de configuration du Repository
# =============================================================================
# Antisèche de la formation (Module 8). Ce fichier surcharge la configuration
# par défaut du Repository. Il est monté dans le conteneur "alfresco" (voir
# docker-compose.yml) à : /usr/local/tomcat/shared/classes/alfresco-global.properties
#
# RÈGLES À RETENIR
#  1. Une modification n'est prise en compte qu'après RECRÉATION du conteneur :
#         docker compose up -d --force-recreate alfresco
#     (un simple "restart" peut garder l'ancienne version du fichier : le
#     fichier monté est identifié par son inode, et certains éditeurs en
#     recréent un nouveau à chaque enregistrement).
#  2. Priorité : propriétés -D de JAVA_OPTS (docker-compose.yml)  >  ce fichier
#     >  valeurs par défaut du produit. Ne PAS redéfinir ici ce qui est déjà
#     fixé par JAVA_OPTS (db.*, solr.*, messaging.broker.url, alfresco.host...).
#  3. Pas d'espace autour du "=" et pas de commentaire en fin de ligne.
# =============================================================================


# --- 1. Emplacement du Content Store ----------------------------------------
# Les fichiers physiques sont stockés ici (volume Docker alf-repo-data).
dir.root=/usr/local/tomcat/alf_data


# --- 2. Limite de taille des fichiers déposés (TP Module 8) -----------------
# Propriété réelle : system.content.maximumFileSizeLimit  (valeur en OCTETS).
# Valeur vide ou négative = pas de limite (défaut).
#   1 Mo  = 1048576        200 Mo = 209715200
# TP : décommenter la ligne suivante (limite à 1 Mo), recréer le conteneur,
# tenter d'envoyer un fichier de 2 Mo, puis passer à 200 Mo.
#system.content.maximumFileSizeLimit=1048576


# --- 3. CORS pour Content App (port 8082) -----------------------------------
# L'UI (localhost:8082) appelle l'API via le proxy (localhost:8080).
cors.enabled=true
cors.allowed.origins=http://localhost:8082
cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS,HEAD
cors.allowed.headers=Authorization,Content-Type,Cache-Control,X-Requested-With,X-CSRF-Token,Accept,Origin
cors.exposed.headers=Access-Control-Allow-Origin,Access-Control-Allow-Credentials
cors.support.credentials=true


# --- 4. Authentification ----------------------------------------------------
# Chaîne d'authentification : les sources sont interrogées DANS L'ORDRE.
# Par défaut : uniquement le référentiel interne ("alfrescoNtlm").
authentication.chain=alfrescoNtlm1:alfrescoNtlm

# >>> TP Module 8 : brancher l'annuaire OpenLDAP de test (service "openldap").
# 1) Remplacer la ligne authentication.chain ci-dessus par :
#      authentication.chain=alfrescoNtlm1:alfrescoNtlm,ldap1:ldap
#    (l'interne EN PREMIER : le compte admin reste utilisable si l'annuaire tombe)
# 2) Décommenter le bloc ci-dessous, puis :
#      docker compose up -d --force-recreate alfresco
#
#ldap.authentication.active=true
#ldap.authentication.java.naming.provider.url=ldap://openldap:389
#ldap.authentication.userNameFormat=uid=%s,ou=people,dc=formation,dc=local
#ldap.authentication.allowGuestLogin=false
#ldap.synchronization.active=true
#ldap.synchronization.java.naming.security.principal=cn=admin,dc=formation,dc=local
#ldap.synchronization.java.naming.security.credentials=admin
#ldap.synchronization.userSearchBase=ou=people,dc=formation,dc=local
#ldap.synchronization.groupSearchBase=ou=groups,dc=formation,dc=local
#ldap.synchronization.personType=inetOrgPerson
#ldap.synchronization.groupType=groupOfNames
#ldap.synchronization.userIdAttributeName=uid
#ldap.synchronization.userFirstNameAttributeName=givenName
#ldap.synchronization.userLastNameAttributeName=sn
#ldap.synchronization.userEmailAttributeName=mail
#ldap.synchronization.groupIdAttributeName=cn
#ldap.synchronization.groupMemberAttributeName=member
# (la synchronisation au démarrage est active par défaut : synchronization.syncOnStartup=true)


# --- 5. Protocoles d'accès fichiers ------------------------------------------
# FTP (port 2121 dans le conteneur, publié sur l'hôte en 2121).
# Remarque : CIFS/SMB a été supprimé d'Alfresco depuis la version 6 (SMBv1).
ftp.enabled=true
ftp.port=2121
# Plage de ports du mode passif (publiée par docker-compose.yml)
ftp.dataPortFrom=21000
ftp.dataPortTo=21010
# Adresse annoncée aux clients FTP en mode passif (poste local = 127.0.0.1)
ftp.externalAddress=127.0.0.1

# WebDAV : toujours actif -> http://localhost:8080/alfresco/webdav/


# --- 6. Messagerie sortante (SMTP) -> Mailpit (http://localhost:8025) ---------
# Notifications : invitations de site, règles "Envoyer un e-mail", tâches...
mail.host=mailpit
mail.port=1025
mail.protocol=smtp
mail.encoding=UTF-8
mail.smtp.auth=false
mail.smtp.starttls.enable=false
mail.from.default=alfresco@formation.local
mail.from.enabled=false
notification.email.siteinvite=true


# --- 7. Messagerie : IMAP (lecture du référentiel avec un client mail) --------
imap.server.enabled=true
imap.server.host=0.0.0.0
imap.server.port=143

# SMTP ENTRANT (Alfresco reçoit des e-mails et les range dans un dossier) —
# optionnel, voir Module 9 (désactivé par défaut).
#email.server.enabled=true
#email.inbound.enabled=true
#email.server.port=1025
#email.server.domain=formation.local
#email.inbound.unknownUser=admin


# --- 8. Journalisation (Module 9) --------------------------------------------
# Les logs sont écrits sur la sortie standard du conteneur
#     docker compose logs alfresco
# et dans /usr/local/tomcat/logs/ (catalina.*, localhost.*).
# Pour changer un niveau de log : fichier custom-log4j2.properties
# (voir extensions/custom-log4j2.properties et docker-compose.extensions.yml).
