# =============================================================================
# alfresco-global.properties — fichier remis aux stagiaires (Module 8, Jour 3)
# =============================================================================
# Ce fichier surcharge la configuration par défaut du Repository.
# Il est monté dans le conteneur "alfresco" (voir docker-compose.yml) à
# l'emplacement /usr/local/tomcat/shared/classes/alfresco-global.properties
#
# Un redémarrage du conteneur (docker compose restart alfresco) est
# nécessaire après toute modification.

# --- Limite de taille des fichiers uploadés (exercice Module 8) -------------
# Valeur par défaut Alfresco : 0 = illimité côté repo (la limite réelle vient
# souvent du reverse-proxy). On force ici une limite explicite pédagogique.
content.stream.maxSizeMB=200

# --- CORS pour Content App sur le port 8082 ---------------------------------
# L'UI (localhost:8082) appelle l'API via le proxy (localhost:8080).
cors.enabled=true
cors.allowed.origins=http://localhost:8082
cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS,HEAD
cors.allowed.headers=Authorization,Content-Type,Cache-Control,X-Requested-With,X-CSRF-Token,Accept,Origin
cors.exposed.headers=Access-Control-Allow-Origin,Access-Control-Allow-Credentials
cors.support.credentials=true

# --- Emplacement du Content Store --------------------------------------------
dir.root=/usr/local/tomcat/alf_data

# --- Authentification externe (exercice Module 8) ---------------------------
# Chaîne d'authentification par défaut : uniquement le référentiel interne.
# Les stagiaires doivent ajouter "ldap1" à la suite pour brancher l'annuaire
# de test fourni (voir README.md du projet fil rouge, étape J3-2).
authentication.chain=alfrescoNtlm1:alfrescoNtlm

# Modèle de configuration LDAP à décommenter et compléter pendant le TP :
# authentication.chain=alfrescoNtlm1:alfrescoNtlm,ldap1:ldap
# ldap.authentication.active=true
# ldap.authentication.java.naming.provider.url=ldap://openldap:389
# ldap.authentication.userNameFormat=uid=%s,ou=people,dc=formation,dc=local
# ldap.synchronization.java.naming.security.principal=cn=admin,dc=formation,dc=local
# ldap.synchronization.java.naming.security.credentials=admin
# ldap.synchronization.active=true
# ldap.synchronization.userSearchBase=ou=people,dc=formation,dc=local
# ldap.synchronization.groupSearchBase=ou=groups,dc=formation,dc=local

# --- Messagerie (protocole IMAP, Module 9) -----------------------------------
imap.server.enabled=true
imap.server.host=0.0.0.0
imap.server.port=143

# --- Logging (Module 9) ------------------------------------------------------
# Les fichiers de logs sont accessibles dans le conteneur sous
# /usr/local/tomcat/logs/ (catalina.out) — voir README.md étape J3-3.
