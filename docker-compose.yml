
# =============================================================================
# Projet fil rouge — Formation Alfresco Administrateur (édition Community)
# =============================================================================
# Services :
#   alfresco ........ Repository (le moteur) + API REST/CMIS/WebDAV/FTP/IMAP
#   share ........... Interface historique (Alfresco Share)
#   content-app ..... Interface moderne (équivalent Community d'ADW)
#   proxy ........... Point d'entrée unique http://localhost:8080
#   postgres ........ Base de données (métadonnées)          -> localhost:5433
#   search .......... Moteur de recherche Solr (index)       -> localhost:8083
#   transform-core-aio  Service de transformation (aperçus)  -> localhost:8091
#   activemq ........ Bus de messages                        -> localhost:8161
#   openldap ........ Annuaire de test (Module 8)            -> ldap://localhost:3389
#   mailpit ......... Boîte mail de test (SMTP sortant)      -> http://localhost:8025
#
# Extensions optionnelles (Module 8/9) : docker-compose.extensions.yml
#   docker compose -f docker-compose.yml -f docker-compose.extensions.yml up -d

services:

  alfresco:
    image: alfresco/alfresco-content-repository-community:${ACS_TAG}
    mem_limit: 1700m
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Dencryption.keystore.type=JCEKS
        -Dencryption.cipherAlgorithm=DESede/CBC/PKCS5Padding
        -Dencryption.keyAlgorithm=DESede
        -Dencryption.keystore.location=/usr/local/tomcat/shared/classes/alfresco/extension/keystore/keystore
        -Dmetadata-keystore.password=mp6yc0UD9e
        -Dmetadata-keystore.aliases=metadata
        -Dmetadata-keystore.metadata.password=oKIWzVdEdA
        -Dmetadata-keystore.metadata.algorithm=DESede
      JAVA_OPTS: >-
        -Ddb.driver=org.postgresql.Driver
        -Ddb.username=alfresco
        -Ddb.password=alfresco
        -Ddb.url=jdbc:postgresql://postgres:5432/alfresco
        -Dsolr.host=search
        -Dsolr.port=8983
        -Dsolr.secureComms=secret
        -Dsolr.sharedSecret=secret
        -Dsolr.base.url=/solr
        -Dindex.subsystem.name=solr6
        -Dshare.host=localhost
        -Dshare.port=8080
        -Dalfresco.host=localhost
        -Dalfresco.port=8080
        -Dmessaging.broker.url="failover:(nio://activemq:61616)?timeout=3000&jms.useCompression=true"
        -Ddeployment.method=DOCKER_COMPOSE
        -DlocalTransform.core-aio.url=http://transform-core-aio:8090/
        -Dcsrf.filter.enabled=false
        -Xms1500m -Xmx1500m
    volumes:
      - alf-repo-data:/usr/local/tomcat/alf_data
      - ./config/alfresco-global.properties:/usr/local/tomcat/shared/classes/alfresco-global.properties:ro
    ports:
      - "8081:8080"          # accès direct au Repository (sans proxy)
      - "2121:2121"          # FTP (Module 3 / 9)
      - "21000-21010:21000-21010"   # FTP mode passif
      - "1143:143"           # IMAP (Module 6 / 9)
      - "2525:1025"          # SMTP entrant (Module 9, optionnel)
    depends_on:
      - postgres
      - activemq

  share:
    image: alfresco/alfresco-share:${SHARE_TAG}
    environment:
      REPO_HOST: "alfresco"
      REPO_PORT: "8080"
      JAVA_OPTS: >-
        -Xms500m -Xmx500m
        -Dalfresco.host=localhost
        -Dalfresco.port=8080
        -Dalfresco.context=alfresco
        -Dalfresco.protocol=http
    depends_on:
      - alfresco

  postgres:
    image: postgres:${POSTGRES_TAG}
    environment:
      POSTGRES_PASSWORD: alfresco
      POSTGRES_USER: alfresco
      POSTGRES_DB: alfresco
    command: postgres -c max_connections=300 -c log_min_messages=LOG
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  activemq:
    image: alfresco/alfresco-activemq:${ACTIVEMQ_TAG}
    ports:
      - "8161:8161"
      - "5672:5672"
      - "61616:61616"
      - "61613:61613"

  transform-core-aio:
    image: alfresco/alfresco-transform-core-aio:${TRANSFORM_TAG}
    mem_limit: 1536m
    environment:
      JAVA_OPTS: " -Xms256m -Xmx1536m"
      ACTIVEMQ_URL: "nio://activemq:61616"
      ACTIVEMQ_USER: "admin"
      ACTIVEMQ_PASSWORD: "admin"
    ports:
      - "8091:8090"

  search:
    image: alfresco/alfresco-search-services:${SEARCH_TAG}
    mem_limit: 2g
    environment:
      #Solr needs to know how to register itself with Alfresco
      SOLR_ALFRESCO_HOST: "alfresco"
      SOLR_ALFRESCO_PORT: "8080"
      #Alfresco needs to know how to call solr
      SOLR_SOLR_HOST: "search"
      SOLR_SOLR_PORT: "8983"
      #Create the default alfresco and archive cores
      SOLR_CREATE_ALFRESCO_DEFAULTS: "alfresco,archive"
      # Secret partagé avec le repository (solr.secureComms=secret)
      ALFRESCO_SECURE_COMMS: "secret"
      JAVA_TOOL_OPTIONS: >-
        -Dalfresco.secureComms.secret=secret
    volumes:
      - solr-data:/opt/alfresco-search-services/data
    ports:
      - "8083:8983"

  # Équivalent Community de Digital Workspace (ADW Enterprise = quay.io, licence).
  # Accessible directement sur 8082 et aussi via le proxy : http://localhost:8080/aca/
  content-app:
    image: alfresco/alfresco-content-app:${ACA_TAG}
    mem_limit: 128m
    environment:
      APP_CONFIG_PROVIDER: "ECM"
      APP_CONFIG_AUTH_TYPE: "BASIC"
      APP_CONFIG_ECM_HOST: "http://localhost:8080"
      APP_BASE_SHARE_URL: "http://localhost:8082/#/preview/s"
    ports:
      - "8082:8080"
    depends_on:
      - alfresco

  proxy:
    image: alfresco/alfresco-acs-nginx:${NGINX_TAG}
    environment:
      # ADW Enterprise désactivé ; Content App (Community) activé à la place
      DISABLE_ADW: "true"
      ENABLE_CONTENT_APP: "true"
      DISABLE_CONTROL_CENTER: "true"
      DISABLE_SYNCSERVICE: "true"
      DISABLE_PROMETHEUS: "true"
    depends_on:
      - alfresco
      - share
      - content-app
    ports:
      - "8080:8080"
    links:
      - alfresco
      - share
      - content-app

  # Annuaire LDAP de test (Module 8). Utilisateurs/groupes : ldap/bootstrap.ldif
  # Base DN : dc=formation,dc=local — compte admin : cn=admin,dc=formation,dc=local / admin
  openldap:
    image: osixia/openldap:${LDAP_TAG}
    command: --copy-service
    mem_limit: 128m
    environment:
      LDAP_ORGANISATION: "Formation Alfresco"
      LDAP_DOMAIN: "formation.local"
      LDAP_ADMIN_PASSWORD: "admin"
      LDAP_TLS: "false"
    volumes:
      - ./ldap/bootstrap.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-bootstrap.ldif:ro
    ports:
      - "3389:389"

  # Boîte mail de test (Module 5, 6, 9) : capte tous les e-mails sortants d'Alfresco.
  # Interface web : http://localhost:8025 — SMTP interne : mailpit:1025
  mailpit:
    image: axllent/mailpit:${MAILPIT_TAG}
    mem_limit: 128m
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "8025:8025"

volumes:
  alf-repo-data:
  db-data:
  solr-data:
