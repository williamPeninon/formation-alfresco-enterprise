
services:

  alfresco:
    image: alfresco/alfresco-content-repository-community:${ACS_TAG}
    mem_limit: 1700m
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Dencryption.keystore.type=JCEKS
        -Dencryption.cipherAlgorithm=DESede/CBC/PKCS5Padding
        -Dencryption.keyAlgorithm=DESede
        -Dencryption.keystore.location=/usr/local/tomcat/shared/classes/alfresco/extension/keystore/keystore
        -Dmetadata-keystore.password=mp6yc0UD9e
        -Dmetadata-keystore.aliases=metadata
        -Dmetadata-keystore.metadata.password=oKIWzVdEdA
        -Dmetadata-keystore.metadata.algorithm=DESede
      JAVA_OPTS: >-
        -Ddb.driver=org.postgresql.Driver
        -Ddb.username=alfresco
        -Ddb.password=alfresco
        -Ddb.url=jdbc:postgresql://postgres:5432/alfresco
        -Dsolr.host=search
        -Dsolr.port=8983
        -Dsolr.secureComms=secret
        -Dsolr.sharedSecret=secret
        -Dsolr.base.url=/solr
        -Dindex.subsystem.name=solr6
        -Dshare.host=share
        -Dshare.port=8080
        -Dalfresco.host=localhost
        -Dalfresco.port=8080
        -Dmessaging.broker.url="failover:(nio://activemq:61616)?timeout=3000&jms.useCompression=true"
        -Ddeployment.method=DOCKER_COMPOSE
        -DlocalTransform.core-aio.url=http://transform-core-aio:8090/
        -Dcsrf.filter.enabled=false
        -Xms1500m -Xmx1500m
    volumes:
      - alf-repo-data:/usr/local/tomcat/alf_data
      - ./config/alfresco-global.properties:/usr/local/tomcat/shared/classes/alfresco-global.properties:ro
    ports:
      - "8081:8080"
    depends_on:
      - postgres
      - activemq

  share:
    image: alfresco/alfresco-share:${SHARE_TAG}
    environment:
      REPO_HOST: "alfresco"
      REPO_PORT: "8080"
      JAVA_OPTS: >-
        -Xms500m -Xmx500m
        -Dalfresco.host=localhost
        -Dalfresco.port=8080
        -Dalfresco.context=alfresco
        -Dalfresco.protocol=http
    depends_on:
      - alfresco

  postgres:
    image: postgres:${POSTGRES_TAG}
    environment:
      POSTGRES_PASSWORD: alfresco
      POSTGRES_USER: alfresco
      POSTGRES_DB: alfresco
    command: postgres -c max_connections=300 -c log_min_messages=LOG
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  activemq:
    image: alfresco/alfresco-activemq:${ACTIVEMQ_TAG}
    ports:
      - "8161:8161"
      - "5672:5672"
      - "61616:61616"
      - "61613:61613"

  transform-core-aio:
    image: alfresco/alfresco-transform-core-aio:${TRANSFORM_TAG}
    mem_limit: 1536m
    environment:
      JAVA_OPTS: " -Xms256m -Xmx1536m"
      ACTIVEMQ_URL: "nio://activemq:61616"
      ACTIVEMQ_USER: "admin"
      ACTIVEMQ_PASSWORD: "admin"
    ports:
      - "8091:8090"

  search:
    image: alfresco/alfresco-search-services:${SEARCH_TAG}
    mem_limit: 2g
    environment:
      #Solr needs to know how to register itself with Alfresco
      SOLR_ALFRESCO_HOST: "alfresco"
      SOLR_ALFRESCO_PORT: "8080"
      #Alfresco needs to know how to call solr
      SOLR_SOLR_HOST: "search"
      SOLR_SOLR_PORT: "8983"
      #Create the default alfresco and archive cores
      SOLR_CREATE_ALFRESCO_DEFAULTS: "alfresco,archive"
      # Secret partagé avec le repository (solr.secureComms=secret)
      ALFRESCO_SECURE_COMMS: "secret"
      JAVA_TOOL_OPTIONS: >-
        -Dalfresco.secureComms.secret=secret
    volumes:
      - solr-data:/opt/alfresco-search-services/data
    ports:
      - "8083:8983"

  proxy:
    image: alfresco/alfresco-acs-nginx:${NGINX_TAG}
    environment:
      # Pas de digital-workspace / control-center / sync dans ce compose Community
      DISABLE_ADW: "true"
      DISABLE_CONTROL_CENTER: "true"
      DISABLE_SYNCSERVICE: "true"
      DISABLE_PROMETHEUS: "true"
    depends_on:
      - alfresco
      - share
    ports:
      - "8080:8080"
    links:
      - alfresco
      - share

volumes:
  alf-repo-data:
  db-data:
  solr-data:
